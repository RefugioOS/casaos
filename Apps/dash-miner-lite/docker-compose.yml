services:
  app:
    # network_mode: host es necesario porque el bridge integrado usa
    # os.networkInterfaces() para detectar la subred real del servidor y
    # escanear/controlar mineros en tu LAN. Sin privileged ni NET_ADMIN:
    # solo TCP connects salientes.
    image: ghcr.io/refugioos/dash-miner-lite:0.1.0-beta.1
    network_mode: host
    restart: on-failure

x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  author: RefugioOS
  developer: RefugioOS
  title:
    en_us: Dash Miner Lite (Beta)
  tagline:
    en_us: Local ASIC miner management (beta)
  description:
    en_us: Local dashboard to scan your network, manage ASIC miners and calculate profitability. No cloud, no external accounts.
  category: Finance
  index: /